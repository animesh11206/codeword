name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows-x64
            bin_name: codeword.exe
            asset_name: codeword-windows-x64.exe
          - os: ubuntu-latest
            os_name: linux-x64
            bin_name: codeword
            asset_name: codeword-linux-x64
          - os: macos-latest
            os_name: macos-arm64
            bin_name: codeword
            asset_name: codeword-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/dist"
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE="${{ github.workspace }}/dist"

      - name: Build Codeword
        run: cmake --build build --config Release --parallel

      - name: Prepare Release Binary
        shell: bash
        run: |
          mv "dist/${{ matrix.bin_name }}" "dist/${{ matrix.asset_name }}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "dist/${{ matrix.asset_name }}"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Codeword ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            release_assets/codeword-windows-x64.exe
            release_assets/codeword-linux-x64
            release_assets/codeword-macos-arm64
